<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="AWS User Group Guatemala es una comunidad apasionada por aprender, colaborar y compartir conocimientos sobre tecnologías en la nube de AWS."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/img/Logo_USGuatemala_Oficial.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (para redes sociales como Facebook y WhatsApp) -->
    <meta property="og:title" content="AWS User Group Guatemala" />
    <meta
      property="og:description"
      content="Únete al AWS User Group Guatemala, una comunidad que empodera a entusiastas y profesionales en tecnologías cloud a través de eventos, talleres y charlas en un ambiente inclusivo."
    />
    <meta property="og:image" content="%PUBLIC_URL%/img/Logo_USGuatemala_Oficial.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://awsugguatemala.org/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AWS User Group Guatemala" />
    <meta
      name="twitter:description"
      content="Somos una comunidad apasionada por aprender, colaborar y compartir conocimientos sobre tecnologías en la nube de AWS. Únete a nosotros y sé parte de la transformación tecnológica."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/img/Logo_USGuatemala_Oficial.png" />

    <!-- Configuración específica para LinkedIn -->
    <meta property="og:site_name" content="AWS User Group Guatemala" />
    <meta property="og:locale" content="es_ES" />

    <!-- Página principal -->
    <title>AWS User Group Guatemala</title>
